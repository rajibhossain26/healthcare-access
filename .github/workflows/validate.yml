name: validate

# Independent checks that go beyond the unit tests:
#  * results agree with PySAL `access` and Aceso on random problems
#  * OpenStreetMap drive times work end to end on a real road network
# The comparison report is committed to validation/RESULTS.md.
on:
  push:
    branches: [main]
    paths: ["src/**", "validation/**", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install . access aceso
      - run: pip list | grep -i -E "access|aceso|numpy|pandas"
      - run: python validation/compare_external.py
      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/RESULTS.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update validation report [skip ci]"
          git pull --rebase && git push

  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[osm]"
      - run: python validation/osm_smoke_test.py
