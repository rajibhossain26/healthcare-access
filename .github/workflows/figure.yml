name: build figure

# Regenerates docs/model_comparison.png from examples/synthetic_county_demo.py
on:
  push:
    branches: [main]
    paths: ["examples/**", "src/**", ".github/workflows/figure.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[examples]"
      - run: python examples/synthetic_county_demo.py
      - name: Commit figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/model_comparison.png
          git diff --cached --quiet || git commit -m "Update demo figure [skip ci]"
          git push
