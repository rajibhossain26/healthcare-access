[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthaccess"
version = "0.1.0"
description = "Spatial accessibility to healthcare: 2SFCA, Enhanced 2SFCA, Gaussian 2SFCA and gravity models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rajib Hossain" }]
keywords = ["GIS", "accessibility", "2SFCA", "health geography", "spatial analysis"]
dependencies = ["numpy>=1.22", "pandas>=1.5", "networkx>=2.8"]

[project.optional-dependencies]
osm = ["osmnx>=1.9"]
examples = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
